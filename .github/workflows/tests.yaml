name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: Install Home Assistant and pytest
        # Both pins are load-bearing. api.py imports homeassistant.components.llm,
        # which first shipped in 2026.8.0, and every core since 2026.3 requires
        # Python >=3.14.2 -- so on a 3.13 runner pip caps out at homeassistant 2026.2.3
        # and the suite dies at collection with ModuleNotFoundError. The version floor
        # turns that silent downgrade into a resolution error that names the cause.
        run: pip install "homeassistant>=2026.8.0" pytest
      - name: Show what resolved
        run: python -c "import homeassistant.const as c, sys; print('HA', c.__version__, '| py', sys.version)"
      - name: Install what the imported components pin
        # Derived from the installed core rather than pinned here, so a new Home
        # Assistant release cannot leave this job installing versions it does not use.
        run: |
          python scripts/collect_test_requirements.py > /tmp/component-requirements.txt
          cat /tmp/component-requirements.txt
          pip install -r /tmp/component-requirements.txt
      - name: Run tests
        run: pytest -q
