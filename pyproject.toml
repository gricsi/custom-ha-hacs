[project]
name = "ha-lumo"
version = "0.1.0"
description = "Home Assistant conversation agent backed by Proton Lumo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant>=2026.8.0",
    "pytest",
    "voluptuous",
    "PyYAML",
    "beautifulsoup4",
    "openai>=2.45.0,<4",
    "python-slugify",
    "voluptuous-openapi",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
# The integration lives at custom_components/lumo/, so the tests import it the way
# Home Assistant does -- from the repo root, as custom_components.lumo.*
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 120
preview = true
target-version = ['py313']

[tool.isort]
profile = "black"


[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "PLC", "PLE", "PLW", "FLY", "RUF"]
